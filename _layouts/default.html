<!DOCTYPE HTML>
<html>
	<head>
		<title>{{ page.title | default: "Analyst Studios" }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
	</head>

	<body class="is-preload">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">
				<div class="inner">

					<!-- Header -->
					<header id="header">
						<a href="{{ '/' | relative_url }}" class="logo">
							<strong>Analyst</strong> Studios
						</a>
					</header>

					<!-- Page Content -->
					<section>
						{{ content }}
					</section>

				</div>
			</div>

			<!-- Sidebar -->
			<div id="sidebar">

				<!-- Shared Sidebar -->
				<div id="sidebar-menu"></div>

			</div>

		</div>

		<!-- Scripts -->
		<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/browser.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/breakpoints.min.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/util.js' | relative_url }}"></script>
		<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

		<!-- Load Shared Sidebar -->
		<script>
			fetch('{{ "/menu_sidebar.html" | relative_url }}')
				.then(response => {
					if (!response.ok) {
						throw new Error('Could not load menu_sidebar.html');
					}

					return response.text();
				})
				.then(data => {
					document.getElementById('sidebar-menu').innerHTML = data;

					$('#menu .opener').each(function() {

						var $this = $(this);

						$this.on('click', function(event) {

							event.preventDefault();
							event.stopPropagation();

							var $parent = $this.parent();

							$parent
								.siblings()
								.children('.opener')
								.removeClass('active');

							$this.toggleClass('active');

						});

					});
				})
				.catch(error => {
					console.error('Error loading sidebar:', error);
				});
		</script>

	</body>
</html>
