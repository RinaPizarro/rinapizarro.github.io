<!DOCTYPE HTML>

<html>
	<head>
		<title>Documentations</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
	</head>

	<body class="is-preload">

		<!-- Wrapper -->
		<div id="wrapper">

			<!-- Main -->
			<div id="main">
				<div class="inner">

					<!-- Header -->
					<header id="header">
						<a href="index.html" class="logo">
							<strong>Analyst</strong> Studios
						</a>

					</header>

					<!-- Content -->
					<section>

						<header class="main">
							<h1>Documentations</h1>
						</header>

						<span class="image main">
							<img src="images/pic11.jpg" alt="" />
						</span>

						<p>
							<a href="https://learn.microsoft.com/en-us/powerquery-m/" target="_blank">Power Query M Language Documentation</a>
						</p>

						<p>
							<a href="https://learn.microsoft.com/en-us/dax/" target="_blank">Power BI DAX Functions Documentation</a>
						</p>

						<p>
							<a href="https://support.microsoft.com/en-us/office/excel-functions-by-category-5f91f4e9-7b42-46d2-9bd1-63f26a86c0eb" target="_blank">Excel Functions Documentation</a>
						</p>

                        <p>
							<a href="https://learn.microsoft.com/en-us/graph/api/resources/mail-api-overview?view=graph-rest-1.0" target="_blank">Outlook mail REST API Documentation</a>
						</p>

						<p>
							<a href="https://learn.microsoft.com/en-us/graph/query-parameters?tabs=http" target="_blank">Graph REST API Query Parameters</a>
						</p>
					</section>

				</div>
			</div>

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="inner">

                <!-- Shared Sidebar Menu -->
                <div id="sidebar-menu"></div>

            </div>
        </div>

		</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<!-- Load Shared Sidebar Menu -->
		<script>
			fetch('menu_sidebar.html')
				.then(response => response.text())
				.then(data => {
					document.getElementById('sidebar-menu').innerHTML = data;

					$('#menu .opener').each(function() {

						var $this = $(this);

						$this.on('click', function(event) {

							event.preventDefault();
							event.stopPropagation();

							var $parent = $this.parent();

							$parent
								.siblings()
								.children('.opener')
								.removeClass('active');

							$this.toggleClass('active');

						});

					});
				})
				.catch(error => {
					console.error('Error loading sidebar:', error);
				});
		</script>

	</body>
</html>
