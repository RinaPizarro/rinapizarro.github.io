media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter

    fields:
      - name: layout
        label: Layout
        type: string

      - name: title
        label: Title
        type: string

      - name: categories
        label: Categories
        type: string

      - name: description
        label: Description
        type: text

      - name: body
        label: Content
        type: rich-text
        options:
          media: images